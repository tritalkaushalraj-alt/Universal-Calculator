<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Universal Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#0a0e1a;--cyan:#00d4ff;--mag:#ff2d78;--amber:#ffb347;--surface:#1a2035;--text:#eef6ff;--muted:#8fa0c2;--bad:#ff4b68;--ok:#55ffaa;--card:rgba(26,32,53,.86);--line:rgba(0,212,255,.22)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#122047,#0a0e1a 45%,#050711);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;overflow-x:hidden}#rain{position:fixed;inset:0;z-index:-2;opacity:.75;transition:opacity 1s}.glow{position:fixed;inset:auto -20% -40% -20%;height:55vh;background:radial-gradient(circle,rgba(0,212,255,.16),transparent 65%);z-index:-1}header{position:sticky;top:0;z-index:5;background:rgba(10,14,26,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:18px clamp(16px,4vw,42px)}.brand{display:flex;align-items:center;gap:14px;margin-bottom:14px}.brand h1{margin:0;font-size:clamp(1.6rem,4vw,3rem);letter-spacing:.03em;text-shadow:0 0 22px rgba(0,212,255,.65)}.orb{width:42px;height:42px;border-radius:50%;background:conic-gradient(var(--cyan),var(--mag),var(--amber),var(--cyan));box-shadow:0 0 28px var(--cyan);animation:pulse 2.4s infinite}.tabs{display:flex;gap:9px;overflow:auto;padding-bottom:4px}.tab{border:1px solid var(--line);background:rgba(26,32,53,.78);color:var(--text);border-radius:999px;padding:10px 14px;white-space:nowrap;cursor:pointer;transition:.25s}.tab:hover,.tab.active{transform:translateY(-2px);box-shadow:0 0 18px rgba(0,212,255,.35);border-color:var(--cyan)}.tab.active{background:linear-gradient(135deg,rgba(0,212,255,.24),rgba(255,45,120,.16))}main{padding:24px clamp(14px,3vw,40px) 80px;max-width:1440px;margin:auto}.module{display:none;animation:slide .25s ease}.module.active{display:block}.intro{color:var(--muted);margin-top:-6px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{grid-column:span 6;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.28);transition:.25s}.card:hover{transform:translateY(-3px);box-shadow:0 0 24px rgba(0,212,255,.18)}.full{grid-column:1/-1}.third{grid-column:span 4}.mini{grid-column:span 3}h2,h3{margin:0 0 12px}h3{color:var(--cyan)}label{display:block;color:var(--muted);font-size:.9rem;margin:8px 0 5px}input,select,textarea{width:100%;border:1px solid rgba(143,160,194,.28);background:rgba(6,10,24,.86);color:var(--text);border-radius:12px;padding:11px;font-family:'JetBrains Mono',monospace;outline:none}input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,255,.12)}button{position:relative;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,rgba(0,212,255,.14),rgba(255,45,120,.11));color:var(--text);border-radius:14px;padding:11px 13px;font-weight:700;cursor:pointer;transition:.2s}button:hover{transform:translateY(-2px);box-shadow:0 0 18px rgba(0,212,255,.28)}button:active{transform:scale(.98)}.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:ripple .55s linear;pointer-events:none}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.row2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.result{margin-top:12px;padding:14px;border-radius:16px;background:rgba(255,179,71,.08);border:1px solid rgba(255,179,71,.32);color:var(--amber);font-family:'JetBrains Mono',monospace;white-space:pre-wrap;min-height:48px}.formula{color:var(--cyan);font-family:'JetBrains Mono',monospace;font-size:.88rem}.calc{grid-template-columns:1.1fr .9fr}.display{background:#050815;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;text-align:right}.expr{color:var(--muted);min-height:22px}.answer{font-family:'JetBrains Mono';font-size:2.1rem;color:var(--amber);word-break:break-all}.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.key-op{color:var(--cyan)}.key-eq{background:linear-gradient(135deg,var(--cyan),var(--mag));color:#07101c}.history-panel{position:fixed;right:18px;bottom:18px;width:min(390px,calc(100vw - 36px));max-height:50vh;overflow:auto;background:rgba(10,14,26,.94);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 0 35px rgba(0,212,255,.16);z-index:4}.hist-item{border-bottom:1px solid rgba(143,160,194,.18);padding:10px 0;color:var(--muted);font-size:.88rem}.hist-item b{color:var(--amber)}table{width:100%;border-collapse:collapse;margin-top:10px}td,th{border:1px solid rgba(143,160,194,.22);padding:8px;text-align:center}th{color:var(--cyan)}.shake{animation:shake .35s}.pill{display:inline-block;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--cyan);margin:3px}.svgbox{width:100%;max-height:260px}.bit{display:inline-block;margin:2px;padding:5px 7px;border-radius:6px;background:#0b1021;border:1px solid var(--line);font-family:'JetBrains Mono'}@keyframes pulse{50%{filter:brightness(1.4);transform:scale(1.08)}}@keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}@keyframes ripple{to{transform:scale(4);opacity:0}}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}@media(max-width:900px){.card,.third,.mini{grid-column:1/-1}.grid.calc{grid-template-columns:1fr}.history-panel{position:static;width:auto;max-height:none;margin:10px 14px 30px}.keys{grid-template-columns:repeat(4,1fr)}}
</style>
</head><body><canvas id="rain"></canvas><div class="glow"></div><header><div class="brand"><div class="orb"></div><div><h1>Universal Calculator</h1><div class="intro">Deep-space scientific, physics, chemistry, data, electrical, trig, logic and conversion lab.</div></div></div><nav class="tabs" id="tabs"></nav></header><main id="app"></main><aside class="history-panel"><h3>Floating History</h3><input id="quickSearch" placeholder="Search history..."><div id="floatHistory"></div></aside>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], fmt=n=>Number.isFinite(+n)?(+n).toLocaleString(undefined,{maximumFractionDigits:8}):n;
const modules=['Calculator','Physics','Data & Speed','Electricity','Chemistry','Trigonometry','Logic & Conversions','History Log']; let active=0, memory=0, expr='', deg=true, history=JSON.parse(localStorage.ucHistory||'[]');
function log(module,inputs,result){history.unshift({time:new Date().toLocaleString(),module,inputs,result:String(result)});history=history.slice(0,200);localStorage.ucHistory=JSON.stringify(history);renderHistory()}
function err(el,msg){el.textContent=msg;el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),400)}
function animateNum(el,val){let n=parseFloat(String(val).replace(/,/g,'')); if(!Number.isFinite(n)){el.textContent=val;return} let st=performance.now(); requestAnimationFrame(function step(t){let p=Math.min(1,(t-st)/500);el.textContent=fmt(n*p); if(p<1)requestAnimationFrame(step)})}
function makeUI(){tabs.innerHTML=modules.map((m,i)=>`<button class="tab ${i?'':'active'}" data-i="${i}">${m}</button>`).join(''); app.innerHTML=modules.map((m,i)=>`<section class="module ${i?'':'active'}" id="m${i}"><h2>${m}</h2><p class="intro">${desc(i)}</p>${content(i)}</section>`).join(''); bind()}
function desc(i){return ['Standard and scientific keypad with memory, keyboard support, degree/radian trig and math.js evaluation.','Physics solvers for light-speed units, kinematics, force/energy, gravity and projectiles.','Transfer times, data units, bandwidth and download/upload estimators.','Ohm\'s law, motors, energy cost, capacitors and inductors.','Molar mass, concentration, ideal gas, pH and stoichiometry helpers.','Animated unit circle, trig values, inverse trig, triangle laws and angle conversions.','Base conversion, truth tables, unit conversion, percentages, ratios and combinatorics.','Searchable persistent log of every calculation across all modules.'][i]}
function content(i){return [calcHTML(),physicsHTML(),dataHTML(),elecHTML(),chemHTML(),trigHTML(),logicHTML(),histHTML()][i]}
function calcHTML(){let keys=['sin','cos','tan','log','ln','√','x²','xⁿ','π','e','!','%','(',')','⌫','7','8','9','/','C','4','5','6','*','MR','1','2','3','-','M+','0','.','=','+','M-','MC'];return `<div class="grid calc"><div class="card full"><div class="display"><div class="expr" id="expr"></div><div class="answer" id="ans">0</div></div><div class="row2"><button id="mode">Degrees</button><button onclick="runCalc()">Calculate Enter</button></div><div class="keys">${keys.map(k=>`<button class="${'=+-*/'.includes(k)||['sin','cos','tan','log','ln'].includes(k)?'key-op':''} ${k=='='?'key-eq':''}" data-key="${k}">${k}</button>`).join('')}</div></div></div>`}
function physicsHTML(){return `<div class="grid"><div class="card third"><h3>Speed of Light</h3><p class="formula">c = 299,792,458 m/s</p><input id="cval" placeholder="1"><select id="cunit"><option>m/s</option><option>km/s</option><option>miles/s</option><option>mph</option><option>mach</option><option>light-minutes</option><option>light-years</option></select><button onclick="speedLight()">Convert</button><div class="result" id="cres"></div></div><div class="card third"><h3>Kinematics</h3><p class="formula">v=u+at; s=ut+½at²; v²=u²+2as</p>${['u','v','a','t','s'].map(x=>`<input id="k${x}" placeholder="${x} (blank unknown)">`).join('')}<button onclick="kinematics()">Solve blanks</button><div class="result" id="kres"></div></div><div class="card third"><h3>Force, Work & Energy</h3>${['mass kg','accel m/s²','force N','distance m','velocity m/s','height m'].map((p,i)=>`<input id="fe${i}" placeholder="${p}">`).join('')}<button onclick="energy()">Compute</button><div class="result" id="feres"></div></div><div class="card full"><h3>Gravity & Projectile</h3><div class="row3"><input id="pv" placeholder="initial speed m/s"><input id="pa" placeholder="angle degrees"><input id="fh" placeholder="free fall height m"></div><button onclick="projectile()">Launch</button><div class="result" id="pres"></div></div></div>`}
function dataHTML(){return `<div class="grid"><div class="card third"><h3>Transfer Time</h3><p class="formula">Time = File Size bits ÷ Speed bps</p><input id="fs" placeholder="File size"><select id="fsu"><option>GB</option><option>MB</option><option>KB</option><option>B</option><option>TB</option><option>PB</option></select><input id="sp" placeholder="Speed"><select id="spu"><option>Mbps</option><option>Gbps</option><option>Kbps</option><option>bps</option></select><button onclick="transfer()">Estimate</button><div id="tres" class="result"></div></div><div class="card third"><h3>Data Unit Converter</h3><input id="du" placeholder="1"><select id="duu"><option>GB</option><option>MB</option><option>byte</option><option>bit</option><option>TB</option><option>PB</option></select><button onclick="dataConv()">Convert</button><div id="dures" class="result"></div></div><div class="card third"><h3>Bandwidth Estimator</h3><input id="users" placeholder="users"><select id="act"><option value="25">streaming 4K</option><option value="8">HD</option><option value="3">SD</option><option value="4">video call</option><option value="1">gaming</option><option value=".5">browsing</option></select><button onclick="bandwidth()">Recommend</button><div id="bres" class="result"></div></div><div class="card full"><h3>Download Presets</h3><select id="preset"><option value="50">4K movie ~50GB</option><option value="8">HD movie ~8GB</option><option value="100">Game ~100GB</option><option value=".005">Song ~5MB</option></select><input id="presetSpeed" placeholder="Mbps"><button onclick="presetTime()">Estimate</button><div id="ptres" class="result"></div></div></div>`}
function elecHTML(){return `<div class="grid"><div class="card third"><h3>Ohm's Law</h3><p class="formula">V=IR, P=VI</p>${['V','I','R','P'].map(x=>`<input id="o${x}" placeholder="${x}">`).join('')}<button onclick="ohm()">Solve</button><svg class="svgbox" viewBox="0 0 300 110"><rect x="70" y="30" width="90" height="40" rx="8" fill="none" stroke="#00d4ff"/><path d="M20 50h50M160 50h80v35H20V50" fill="none" stroke="#8fa0c2"/><circle cx="245" cy="50" r="18" fill="none" stroke="#ff2d78"/></svg><div id="ohres" class="result"></div></div><div class="card third"><h3>RPM & Motor</h3><input id="hz" placeholder="Frequency Hz"><input id="poles" placeholder="Poles"><input id="mw" placeholder="Power watts"><button onclick="motor()">Compute</button><div id="mores" class="result"></div></div><div class="card third"><h3>Energy Cost</h3>${['Wattage','hours/day','days','cost per kWh'].map((p,i)=>`<input id="ec${i}" placeholder="${p}">`).join('')}<button onclick="cost()">Cost</button><div id="ecres" class="result"></div></div><div class="card full"><h3>Capacitor & Inductor</h3><div class="row3"><input id="rr" placeholder="R ohms"><input id="cc" placeholder="C farads"><input id="ff" placeholder="f Hz"><input id="ll" placeholder="L henrys"></div><button onclick="react()">Compute</button><div id="rxres" class="result"></div></div></div>`}
function chemHTML(){return `<div class="grid"><div class="card third"><h3>Molar Mass</h3><input id="formula" placeholder="e.g. H2O"><button onclick="molarMass()">Parse</button><div id="mmres" class="result"></div></div><div class="card third"><h3>Molarity & Dilution</h3><input id="mol" placeholder="moles"><input id="lit" placeholder="liters"><input id="mass" placeholder="mass g"><input id="mm" placeholder="molar mass"><div class="row2"><input id="c1" placeholder="C1"><input id="v1" placeholder="V1"><input id="c2" placeholder="C2"><input id="v2" placeholder="V2"></div><button onclick="molarity()">Solve</button><div id="mres" class="result"></div></div><div class="card third"><h3>Ideal Gas & pH</h3><p class="formula">PV=nRT; pH=-log[H+]</p>${['P','V','n','T'].map(x=>`<input id="g${x}" placeholder="${x} blank unknown">`).join('')}<select id="R"><option value="8.314">J units R=8.314</option><option value="0.08206">L·atm R=0.08206</option></select><input id="hion" placeholder="[H+] or pH"><button onclick="gasph()">Solve</button><div id="gres" class="result"></div></div><div class="card full"><h3>Stoichiometry Helper</h3><div class="row3"><input id="coefA" placeholder="known coefficient"><input id="qtyA" placeholder="known quantity"><input id="coefB" placeholder="target coefficient"></div><button onclick="stoich()">Ratio</button><div id="sres" class="result"></div></div></div>`}
function trigHTML(){return `<div class="grid"><div class="card"><h3>Unit Circle</h3><div class="row2"><input id="ang" placeholder="angle" value="45"><select id="angUnit"><option>degrees</option><option>radians</option></select></div><button onclick="trig()">Compute</button><svg class="svgbox" viewBox="0 0 240 240"><circle cx="120" cy="120" r="82" fill="none" stroke="#00d4ff"/><path d="M20 120h200M120 20v200" stroke="#30405f"/><line id="rad" x1="120" y1="120" x2="178" y2="62" stroke="#ffb347" stroke-width="3"/><circle id="dot" cx="178" cy="62" r="8" fill="#ff2d78"/></svg><div id="trres" class="result"></div></div><div class="card"><h3>Triangles & Angles</h3><input id="asin" placeholder="arcsin input -1..1"><input id="sideA" placeholder="side a"><input id="sideB" placeholder="side b"><input id="sideC" placeholder="side c"><input id="angleA" placeholder="angle A degrees"><button onclick="triangles()">Solve</button><div id="trires" class="result"></div></div></div>`}
function logicHTML(){return `<div class="grid"><div class="card third"><h3>Base Converter</h3><input id="baseVal" placeholder="1010"><select id="baseFrom"><option>Binary</option><option>Octal</option><option>Decimal</option><option>Hexadecimal</option></select><button onclick="bases()">Convert</button><div id="baseres" class="result"></div><div id="bits"></div></div><div class="card third"><h3>Truth Table</h3><select id="gate"><option>AND</option><option>OR</option><option>NOT</option><option>NAND</option><option>NOR</option><option>XOR</option><option>XNOR</option></select><select id="vars"><option>2</option><option>3</option><option>4</option></select><button onclick="truth()">Generate</button><div id="truthres"></div></div><div class="card third"><h3>Unit Converter</h3><input id="uv" placeholder="value"><select id="cat"><option>Length</option><option>Mass</option><option>Temperature</option><option>Speed</option><option>Time</option><option>Pressure</option></select><input id="fromU" placeholder="from unit e.g. m"><input id="toU" placeholder="to unit e.g. ft"><button onclick="unit()">Convert</button><div id="ures" class="result"></div></div><div class="card full"><h3>Percent, Ratio, Factorial, Permutation, Combination</h3><div class="row3"><input id="x" placeholder="X"><input id="y" placeholder="Y"><input id="n" placeholder="n"><input id="r" placeholder="r"></div><button onclick="misc()">Compute</button><div id="miscres" class="result"></div></div></div>`}
function histHTML(){return `<div class="card full"><div class="row3"><input id="histSearch" placeholder="Search"><select id="histMod"><option>All</option>${modules.map(m=>`<option>${m}</option>`).join('')}</select><button onclick="history=[];localStorage.ucHistory='[]';renderHistory()">Clear history</button></div><div id="histList"></div></div>`}
function bind(){tabs.onclick=e=>{if(e.target.dataset.i){active=+e.target.dataset.i;$$('.tab,.module').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');$('#m'+active).classList.add('active');renderHistory()}};document.body.addEventListener('click',e=>{if(e.target.matches('button')){let r=document.createElement('span'),b=e.target.getBoundingClientRect();r.className='ripple';r.style.cssText=`left:${e.clientX-b.left}px;top:${e.clientY-b.top}px;width:40px;height:40px`;e.target.append(r);setTimeout(()=>r.remove(),600)}});$$('[data-key]').forEach(b=>b.onclick=()=>press(b.dataset.key));mode.onclick=()=>{deg=!deg;mode.textContent=deg?'Degrees':'Radians'};document.onkeydown=e=>{if(active===0){if('0123456789.+-*/()'.includes(e.key))press(e.key); if(e.key==='Enter')runCalc(); if(e.key==='Escape')press('C'); if(e.key==='Backspace')press('⌫')}};quickSearch.oninput=renderHistory;renderHistory(); if(window.lucide)lucide.createIcons()}
function press(k){if(k==='C'){expr='';ans.textContent='0'}else if(k==='⌫')expr=expr.slice(0,-1);else if(k==='=')runCalc();else if(k==='MR')expr+=memory;else if(k==='MC')memory=0;else if(k==='M+')memory+=+ans.textContent||0;else if(k==='M-')memory-=+ans.textContent||0;else expr+=({'√':'sqrt(','x²':'^2','xⁿ':'^','π':'pi','e':'e','!':'!','sin':'sin(','cos':'cos(','tan':'tan(','log':'log10(','ln':'log('}[k]||k);$('#expr').textContent=expr}
function runCalc(){try{let ex=expr.replace(/(sin|cos|tan)\(([^()]+)\)/g,(m,f,a)=>`${f}(${deg?`(${a}) deg`:a})`);let res=math.evaluate(ex);$('#expr').textContent=expr+' =';animateNum(ans,res);log('Calculator',expr,res)}catch(e){err(ans,e.message)}}
const v=id=>parseFloat($('#'+id)?.value), out=(id,t)=>{$('#'+id).textContent=t};
function speedLight(){let val=v('cval')||1,u=cunit.value,ms=val*({'m/s':1,'km/s':1000,'miles/s':1609.344,mph:.44704,mach:343,'light-minutes':299792458*60,'light-years':9.4607e15}[u]);let txt=['m/s','km/s','miles/s','mph','mach','light-minutes','light-years'].map(x=>`${x}: ${fmt(ms/({'m/s':1,'km/s':1000,'miles/s':1609.344,mph:.44704,mach:343,'light-minutes':299792458*60,'light-years':9.4607e15}[x]))}`).join('\n');out('cres',txt);log('Physics',val+' '+u,txt)}
function kinematics(){let u=v('ku'),vv=v('kv'),a=v('ka'),t=v('kt'),s=v('ks'),r=[]; if(isFinite(u)&&isFinite(a)&&isFinite(t)){r.push('v = '+fmt(u+a*t));r.push('s = '+fmt(u*t+.5*a*t*t))} if(isFinite(u)&&isFinite(vv)&&isFinite(a))r.push('s = '+fmt((vv*vv-u*u)/(2*a))); if(isFinite(u)&&isFinite(vv)&&isFinite(t))r.push('a = '+fmt((vv-u)/t)); out('kres',r.join('\n')||'Enter any compatible 3 values.'); log('Physics','kinematics',kres.textContent)}
function energy(){let m=v('fe0'),a=v('fe1'),F=v('fe2'),d=v('fe3'),vel=v('fe4'),h=v('fe5'),c=299792458,r=[]; if(isFinite(m)&&isFinite(a))r.push('F=ma: '+fmt(m*a)+' N'); if(isFinite(F)&&isFinite(d))r.push('W=Fd: '+fmt(F*d)+' J'); if(isFinite(m)&&isFinite(vel))r.push('KE: '+fmt(.5*m*vel*vel)+' J'); if(isFinite(m)&&isFinite(h))r.push('PE: '+fmt(m*9.80665*h)+' J'); if(isFinite(m))r.push('E=mc²: '+fmt(m*c*c)+' J'); out('feres',r.join('\n')); log('Physics','energy',feres.textContent)}
function projectile(){let V=v('pv'),A=(v('pa')||0)*Math.PI/180,h=v('fh'),g=9.80665,r=[]; if(isFinite(V)){r.push('Range '+fmt(V*V*Math.sin(2*A)/g)+' m');r.push('Max height '+fmt(V*V*Math.sin(A)**2/(2*g))+' m');r.push('Flight '+fmt(2*V*Math.sin(A)/g)+' s')} if(isFinite(h)){r.push('Free fall time '+fmt(Math.sqrt(2*h/g))+' s');r.push('Impact velocity '+fmt(Math.sqrt(2*g*h))+' m/s')} out('pres',r.join('\n'));log('Physics','projectile',pres.textContent)}
const bits=n=>n*8, si={bit:1,byte:8,B:8,KB:8e3,MB:8e6,GB:8e9,TB:8e12,PB:8e15};function hms(s){return `${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m ${Math.round(s%60)}s`}
function transfer(){let s=(v('fs')||0)*si[fsu.value], speed=(v('sp')||0)*({bps:1,Kbps:1e3,Mbps:1e6,Gbps:1e9}[spu.value]),sec=s/speed;out('tres',`${fmt(sec)} seconds\n${fmt(sec/60)} minutes\n${fmt(sec/3600)} hours\n${hms(sec)}`);log('Data & Speed','transfer',tres.textContent)}
function dataConv(){let b=(v('du')||0)*si[duu.value];out('dures',`bits ${fmt(b)}\nbytes ${fmt(b/8)}\nKB ${fmt(b/8e3)} MB ${fmt(b/8e6)} GB ${fmt(b/8e9)}\nBinary MiB ${fmt(b/8/1024**2)} GiB ${fmt(b/8/1024**3)}`);log('Data & Speed','data',dures.textContent)}
function bandwidth(){out('bres',`${fmt((v('users')||0)*+act.value)} Mbps minimum recommended`);log('Data & Speed','bandwidth',bres.textContent)} function presetTime(){fs.value=preset.value;fsu.value='GB';sp.value=presetSpeed.value;spu.value='Mbps';transfer();ptres.textContent=tres.textContent}
